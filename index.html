<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papan Distribusi — SPPG Bantaeng Gantarangkeke</title>
<meta name="theme-color" content="#0D1620">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monitor MBG">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#FFFFFF;
  --panel:#F1F5F9;
  --rule:#D9E1E9;
  --field:#FFFFFF;
  --zebra:#F7FAFC;
  --amber:#B26E00;
  --text:#0D1620;
  --muted:#5A6E80;

  --sampai:#0B8B4F;
  --jalan:#A37400;
  --telat:#CC5C0A;
  --kendala:#C81E2C;
  --kendala-soft:#9C111D;
  --kendala-bg:rgba(200,30,44,.09);
  --belum:#8496A6;

  --on-amber:#FFFFFF;
  --on-solid:#FFFFFF;

  --isi-a:rgba(23,199,113,.46);
  --isi-teks:#06603A;
  --isi-teks2:#0A7A48;
  --isi-cek:#0B8B4F;
  --isi-kilau:rgba(255,255,255,.62);

  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
body.gelap{
  --board:#070A10;
  --panel:#0D121C;
  --rule:#1C2637;
  --field:#0A0F18;
  --zebra:rgba(255,255,255,.018);
  --amber:#F5B301;
  --text:#EEF3F8;
  --muted:#7788A0;

  --sampai:#35D68C;
  --jalan:#F5B301;
  --telat:#FF8A3C;
  --kendala:#FF4D5A;
  --kendala-soft:#FFB0B6;
  --kendala-bg:rgba(255,77,90,.1);
  --belum:#5D6E85;

  --on-amber:#1D1500;
  --on-solid:#04180D;

  --isi-a:rgba(53,214,140,.30);
  --isi-teks:#9BF7CB;
  --isi-teks2:#5FE0A6;
  --isi-cek:#35D68C;
  --isi-kilau:rgba(150,255,205,.26);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--board);color:var(--text);font-family:var(--body)}
body{min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* titik kecil pemanggil panel kelola */
.hotspot{position:fixed;bottom:0;right:0;width:56px;height:52px;z-index:95;display:flex;
  align-items:center;justify-content:center;border:none;background:none;cursor:pointer}
body.ui-sepi .hotspot,
body.terkunci .hotspot,
body.terkunci .bfoot{display:none !important}
.hotspot i{width:5px;height:5px;border-radius:50%;background:var(--rule);
  transition:background .2s,transform .2s}
.hotspot:hover i,.hotspot:focus-visible i{background:var(--amber);transform:scale(1.8)}

.view{display:none}
.view.is-active{display:block}

/* ================= PAPAN ================= */
.board{padding:0 0 46px;max-width:1600px;margin:0 auto}

.bhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 22px 12px;border-bottom:2px solid var(--amber)}
.blogo{width:clamp(46px,4.6vw,74px);height:auto;flex:none;display:block}
.bhead > div:first-of-type{flex:1;min-width:200px}
.btitle{font-family:var(--display);font-size:clamp(20px,2vw,32px);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;line-height:1}
.bsub{font-family:var(--display);font-size:clamp(12px,1.05vw,16px);font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin-top:5px}
.bclock{text-align:right;line-height:1}
.bclock-time{font-family:var(--display);font-size:clamp(30px,3.6vw,54px);font-weight:700;
  letter-spacing:.03em;font-variant-numeric:tabular-nums}
.bclock-date{font-family:var(--display);font-size:clamp(11px,1vw,15px);font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:5px}

/* Ringkasan */
.bstat{display:flex;gap:0;border-bottom:1px solid var(--rule);background:var(--panel)}
.bstat-i{flex:1;padding:9px 22px;display:flex;align-items:baseline;gap:10px;
  border-right:1px solid var(--rule)}
.bstat-i:last-child{border-right:none}
.bstat-n{font-family:var(--display);font-size:clamp(22px,2.3vw,34px);font-weight:700;
  line-height:1;color:var(--slot);font-variant-numeric:tabular-nums}
.bstat-l{font-family:var(--display);font-size:clamp(11px,1vw,15px);font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* Baris kolom */

@keyframes flap{
  0%{transform:rotateX(-92deg);opacity:.15;filter:brightness(1.35)}
  55%{transform:rotateX(12deg);opacity:1}
  100%{transform:rotateX(0);opacity:1}
}
.flap{animation:flap .5s cubic-bezier(.3,.9,.35,1)}


/* ---------- papan dua kolom, satu per pengantar ---------- */
.papan{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:16px;padding:16px 22px 0}
.kolom{border:1px solid var(--rule);border-radius:6px;overflow:hidden;align-self:start}
.kol-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:10px 14px 9px;background:var(--panel);border-bottom:2px solid var(--amber)}
.kol-kode{font-family:var(--display);font-size:clamp(19px,1.8vw,27px);font-weight:700;
  letter-spacing:.1em;color:var(--amber)}
.kol-drv{font-family:var(--display);font-size:clamp(16px,1.5vw,22px);font-weight:600;
  letter-spacing:.03em;text-transform:uppercase}
.kol-plt{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.kol-prog{margin-left:auto;font-family:var(--display);font-size:clamp(19px,1.8vw,27px);
  font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.kol-prog b{color:var(--text);font-weight:700}
.kol-sub{padding:6px 14px;font-size:11.5px;color:var(--muted);
  border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}

.krow{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr) 60px 124px;
  align-items:center;gap:8px;padding:0 12px;height:var(--rowh,34px);
  border-bottom:1px solid var(--rule);border-left:4px solid var(--slot);overflow:hidden}
.krow > span{position:relative;z-index:1}

/* lapisan hijau: terisi dari kiri, lalu disapu cahaya berjalan */
.riak{position:absolute;top:0;bottom:0;left:0;right:0;z-index:0;pointer-events:none;
  overflow:hidden;transform-origin:left center;
  background:var(--isi-a)}
.krow.isi .riak{animation:terisi .85s cubic-bezier(.2,.85,.3,1)}
@keyframes terisi{
  0%{transform:scaleX(0)}
  100%{transform:scaleX(1)}
}

/* satu sapuan hijau terang yang berjalan dari kiri ke kanan, lalu jeda sejenak */
.riak::before{content:"";position:absolute;top:0;bottom:0;left:-42%;width:42%;
  background:linear-gradient(90deg, transparent, var(--isi-kilau), transparent);
  animation:sapuan 4.2s cubic-bezier(.42,0,.58,1) infinite}
@keyframes sapuan{
  0%{transform:translate3d(0,0,0)}
  58%{transform:translate3d(340%,0,0)}
  100%{transform:translate3d(340%,0,0)}
}


.krow:nth-child(even){background:var(--zebra)}
.krow[data-s="kendala"]{background:var(--kendala-bg)}
.krow[data-s="sampai"] .kc-nm{color:var(--isi-teks);font-weight:600}
.krow[data-s="sampai"] .kc-pm{color:var(--isi-teks2);opacity:1}
.krow[data-s="sampai"] .kc-st{color:var(--isi-teks)}
.krow[data-s="sampai"] .kc-rit{color:var(--isi-teks2)}
.pip.cek{width:auto;height:auto;background:none;color:var(--isi-cek);
  font-size:1.2em;line-height:1;font-style:normal;font-weight:700}
.kc-rit{font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:.06em;
  color:var(--muted)}
.kc-nm{font-family:var(--display);font-size:clamp(15px,1.3vw,19px);font-weight:600;
  letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.kc-pm{font-family:var(--display);font-size:14px;font-weight:500;text-align:right;
  color:var(--muted);font-variant-numeric:tabular-nums}
.kc-st{display:flex;align-items:center;gap:7px;font-family:var(--display);
  font-size:clamp(13px,1.15vw,17px);font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--slot);font-variant-numeric:tabular-nums;
  transform-origin:center top}
.kol-kosong{padding:14px;font-size:12px;color:var(--muted)}

@media (max-width:700px){
  .papan{padding:12px 12px 0;gap:12px}
  .krow{grid-template-columns:30px minmax(0,1fr) 108px;height:auto;padding:8px 10px}
  .kc-pm{display:none}
  .kc-nm{white-space:normal;font-size:14px}
  .kc-st{font-size:12px;justify-content:flex-end}
}

/* Kaki papan */
.bfoot{position:fixed;left:0;right:0;bottom:0;background:var(--panel);
  border-top:1px solid var(--rule);display:flex;align-items:center;gap:0;height:34px;z-index:50}
.ticker{flex:1;overflow:hidden;white-space:nowrap;position:relative;height:100%;
  display:flex;align-items:center}
.ticker-tag{font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--board);background:var(--kendala);
  padding:0 12px;height:100%;display:flex;align-items:center;flex:none}
.ticker-in{display:inline-block;padding-left:100%;font-family:var(--display);font-size:16px;
  font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--kendala-soft);
  animation:slide 26s linear infinite}
@keyframes slide{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.ticker.pesan .ticker-tag{background:var(--sampai)}
.tk{font-weight:600}
.tk-p{font-style:normal;color:var(--muted);opacity:.5;margin:0 18px;font-size:.8em;
  vertical-align:middle}
.bpage{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);padding:0 18px;flex:none;
  border-left:1px solid var(--rule);height:100%;display:flex;align-items:center;gap:10px}
.sim-btn{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);padding:0 18px;height:100%;flex:none;
  border-left:1px solid var(--rule)}
.sim-btn.is-on{color:var(--sampai)}

/* ================= HP PENGANTAR ================= */
.hp{max-width:470px;margin:0 auto;padding:24px 18px 80px}
.hp-head{border-bottom:2px solid var(--amber);padding-bottom:12px}
.hp-role{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--amber)}
.hp-name{font-family:var(--display);font-size:29px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;line-height:1.05;margin-top:3px}
.hp-sub{font-size:12.5px;color:var(--muted);margin-top:6px}

.depart{width:100%;background:var(--amber);color:var(--on-amber);border-radius:5px;padding:17px;
  font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;margin-top:18px}
.depart[disabled]{background:transparent;border:1px solid var(--rule);color:var(--muted);
  cursor:default;font-size:13px;font-weight:500;letter-spacing:.06em;padding:13px}

.hp-pasang{display:none;width:100%;margin-top:26px;padding:14px;border:1px solid var(--amber);
  border-radius:8px;color:var(--amber);font-family:var(--display);font-size:17px;
  font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.hp-ios{display:none;margin-top:22px;padding:12px 14px;border:1px dashed var(--rule);
  border-radius:8px;font-size:12px;color:var(--muted);line-height:1.6}
.hp-ios.is-on{display:block}
.hp-sync{font-size:11.5px;color:var(--muted);margin-top:22px;text-align:center}
.hp-pick-wrap{display:flex;align-items:center;gap:9px;margin-top:11px}
.hp-pick-l{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted)}
.hp-pick{flex:1;background:var(--field);border:1px solid var(--rule);border-radius:5px;
  color:var(--text);font-family:var(--body);font-size:13.5px;padding:9px 10px;cursor:pointer}
.hp-pick:focus{outline:none;border-color:var(--amber)}
.hp-rit{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule)}
.hp-rit:first-child{margin-top:16px}
.hp-rit-t{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--amber);margin-bottom:10px}
.hp-brk{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);
  padding:11px 13px;border:1px solid var(--rule);border-radius:8px}
.hp-brk span{flex:1}
.hp-undo{font-size:12px;color:var(--muted);flex:none;
  box-shadow:inset 0 -1px 0 var(--rule);padding:2px 0}
.hp-undo:hover{color:var(--kendala);box-shadow:inset 0 -1px 0 var(--kendala)}
.hp-warn{font-size:11.5px;color:var(--telat);margin-top:7px;line-height:1.45}
.hp-section{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.stop{background:var(--panel);border-left:4px solid var(--slot);border-radius:4px;
  padding:11px 13px;margin-bottom:7px}
.stop-name{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;line-height:1.2}
.stop-meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.stop-note{font-size:12px;color:var(--kendala-soft);margin-top:5px;line-height:1.45}
.stop-actions{display:flex;gap:8px;margin-top:12px}
.btn-arrive{flex:1;background:var(--sampai);color:var(--on-solid);border-radius:4px;padding:13px;
  font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.btn-issue{border:1px solid var(--kendala);color:var(--kendala);border-radius:4px;padding:13px 16px;
  font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.stop-done{display:flex;align-items:center;gap:10px;margin-top:8px}
.stop-done span{flex:1;font-family:var(--display);font-size:14px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--sampai)}
.hp-empty{color:var(--muted);font-size:13px;line-height:1.6}
.note-hint{margin-top:28px;padding-top:16px;border-top:1px solid var(--rule);
  font-size:12px;color:var(--muted);line-height:1.65}

@media (max-width:820px){
  .bhead{padding:12px 14px 10px}
  .bstat-i{padding:8px 14px}
}
@media (prefers-reduced-motion:reduce){
  .flap{animation:none}
  .riak::before{animation:none;opacity:0}
  .krow.isi .riak{animation:none}
  .ticker-in{animation:none;padding-left:14px}
}

/* ================= PANEL KELOLA ================= */
.k-nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:18px;
  padding:5px;border:1px solid var(--rule);border-radius:6px;background:var(--panel)}
.k-nav button{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);padding:9px 18px;border-radius:4px}
.k-nav button:hover{color:var(--text)}
.k-nav button[aria-pressed="true"]{background:var(--board);color:var(--amber)}
.k-nav .k-nav-tema{margin-left:auto;color:var(--text);border:1px solid var(--rule)}
.k-rit{border-top:1px solid var(--rule)}
.k-rit-head{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--zebra)}
.k-rit-t{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--amber)}
.k-rit-n{font-size:11.5px;color:var(--muted);margin-left:auto}
.k-empty{font-size:12px;color:var(--muted);padding:10px 12px}
.kelola{max-width:1100px;margin:0 auto;padding:22px 20px 90px}
.k-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:2px solid var(--amber)}
.k-title{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase}
.k-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.k-btn{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--amber);border:1px solid var(--rule);
  border-radius:4px;padding:8px 14px}
.k-btn:hover{border-color:var(--amber)}
.k-simpan{color:var(--sampai);border-color:var(--sampai)}
.k-note{font-size:12px;color:var(--muted);line-height:1.6;margin:12px 0 22px}

.k-arm{border:1px solid var(--rule);border-radius:5px;margin-bottom:16px;overflow:hidden}
.k-arm-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:11px 12px;background:var(--panel);border-bottom:1px solid var(--rule)}
.k-lab{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);flex:none}

.k-in{background:var(--field);border:1px solid var(--rule);border-radius:3px;color:var(--text);
  font-family:var(--body);font-size:13.5px;padding:8px 10px;min-width:0}
.k-in:focus{outline:none;border-color:var(--amber)}
.k-kode{width:62px;font-family:var(--display);font-size:16px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--amber);text-align:center}
.k-drv{flex:1;min-width:150px}
.k-plt{width:132px;font-variant-numeric:tabular-nums;letter-spacing:.04em}

.k-rows{padding:6px 12px 2px}
.k-row{display:flex;gap:7px;align-items:center;padding:5px 0}
.k-seq{font-size:11.5px;color:var(--muted);width:20px;flex:none;text-align:right;
  font-variant-numeric:tabular-nums}
.k-nm{flex:1;min-width:0}
.k-jen{width:68px;text-align:center;text-transform:uppercase}
.k-pm{width:74px;text-align:right;font-variant-numeric:tabular-nums}
.k-sel{width:74px;font-family:var(--display);font-size:14px;font-weight:600;
  letter-spacing:.06em;text-align:center;color:var(--amber);cursor:pointer}
.k-mv{color:var(--muted);font-size:15px;line-height:1;padding:7px 5px;flex:none}
.k-mv:hover{color:var(--text)}
.k-x{color:var(--kendala);font-family:var(--display);font-size:14px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;padding:7px 9px;flex:none;
  border:1px solid transparent;border-radius:3px}
.k-x:hover{border-color:var(--kendala)}
.k-add{margin:4px 12px 12px}
.k-foot{border-top:1px solid var(--rule);padding-top:16px;margin-top:24px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}

@media (max-width:700px){
  .k-row{flex-wrap:wrap}
  .k-nm{flex:1 1 100%;order:1}
  .k-seq{order:0}
  .k-jen,.k-pm,.k-sel,.k-mv,.k-x{order:2}
  .k-pm{flex:1}
}
</style>
</head>
<body>

<button class="hotspot" id="hotspot" title="Buka panel kelola (tombol H)" aria-label="Buka panel kelola"><i></i></button>

<main class="view is-active" id="viewTv">

  /* pesan berjalan saat tidak ada kendala */
  var PESAN = [
    "Utamakan keselamatan di jalan — pelan lebih baik daripada cepat tapi celaka",
    "Pastikan wadah tertutup rapat sebelum kendaraan berjalan",
    "Hitung ulang jumlah porsi sebelum meninggalkan dapur",
    "Jaga suhu makanan, jangan berhenti terlalu lama tanpa alasan",
    "Tekan tombol Sudah Sampai begitu serah terima selesai",
    "Ada kendala? Catat segera supaya dapur bisa langsung membantu",
    "Kebersihan tangan dan wadah adalah bagian dari gizi",
    "Sapa dan ucapkan terima kasih kepada guru penerima",
    "Anak-anak menunggu, tapi keselamatanmu lebih berharga dari beberapa menit",
    "Terima kasih sudah menjaga gizi anak Bantaeng setiap hari"
  ];

  var WARNA_PESAN = ["var(--sampai)", "var(--amber)", "var(--telat)", "var(--text)"];

  var AMBANG_TELAT = 30; // menit tanpa antaran baru sebelum ditandai perlu dicek

  /* acuan waktu per rit: antaran terakhir, atau jam berangkat rit itu */
  function acuan(r){
    var t = r.berangkat;
    r.stops.forEach(function(st){
      if(st.s === "sampai" && st.t && (!t || st.t > t)) t = st.t;
    });
    return t;
  }
  function menitJalan(r){
    var t = acuan(r);
    if(!t) return 0;
    return Math.floor((Date.now() - t.getTime())/60000);
  }
  function efektif(r, st){
    if(st.s !== "jalan") return st.s;
    if(!r.berangkat) return "belum";
    return menitJalan(r) >= AMBANG_TELAT ? "telat" : "jalan";
  }
  function ritSelesai(r){
    return r.stops.length > 0 && r.stops.every(function(st){ return st.s === "sampai"; });
  }

  var WARNA = {sampai:"var(--sampai)", jalan:"var(--jalan)", telat:"var(--telat)",
               kendala:"var(--kendala)", belum:"var(--belum)"};

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function angka(n){ return n.toLocaleString("id-ID"); }

  /* susun semua sekolah jadi satu daftar papan */
  function semuaBaris(){
    var out = [];
    armada.forEach(function(a, ai){
      a.rit.forEach(function(r, ri){
        r.stops.forEach(function(st){
          var e = efektif(r, st), teks;
          if(e === "sampai")       teks = "Sampai";
          else if(e === "kendala") teks = "Kendala";
          else if(e === "belum")   teks = "Menunggu";
          else                     teks = "Di jalan " + menitJalan(r) + " mnt";
          out.push({a:a, ai:ai, r:r, ri:ri, st:st, e:e, teks:teks});
        });
      });
    });
    return out;
  }

  var prevStatus = {};

  function aturTinggiBaris(kolom){
    var terpanjang = kolom.reduce(function(x, k){ return Math.max(x, k.isi.length); }, 1);
    var papan = document.getElementById("papan");
    var tersedia = window.innerHeight - (papan ? papan.getBoundingClientRect().top : 260) - 60;
    var tinggi = Math.floor((tersedia - 78) / terpanjang);   // 78px untuk kepala kolom
    tinggi = Math.max(22, Math.min(42, tinggi));
    document.documentElement.style.setProperty("--rowh", tinggi + "px");
  }

  function renderBoard(){
    var baris = semuaBaris();
    var h = {sampai:0, jalan:0, telat:0, kendala:0, belum:0}, kendalaList = [];
    baris.forEach(function(b){
      h[b.e]++;
      if(b.e === "kendala") kendalaList.push(b.st.n.toUpperCase()+" ("+b.a.kode+" RIT "+(b.ri+1)+")");
    });

    var tally = [
      {k:"sampai", label:"Sampai", n:h.sampai},
      {k:"jalan",  label:"Di jalan", n:h.jalan + h.telat},
      {k:"kendala",label:"Kendala", n:h.kendala},
      {k:"belum",  label:"Menunggu", n:h.belum}
    ];
    document.getElementById("tally").innerHTML = tally.map(function(t){
      return '<div class="bstat-i" style="--slot:'+WARNA[t.k]+'"><span class="bstat-n">'+t.n+
        '</span><span class="bstat-l">'+t.label+'</span></div>';
    }).join("");

    /* satu kolom per armada, seluruh ritnya digabung berurutan */
    var kolom = armada.map(function(a, ai){
      var isi = [], sudah = 0;
      a.rit.forEach(function(r, ri){
        r.stops.forEach(function(st){
          var e = efektif(r, st), teks;
          if(e === "sampai"){ teks = "Sampai "+jam(st.t); sudah++; }
          else if(e === "kendala") teks = "Kendala";
          else if(e === "belum")   teks = "Menunggu";
          else                     teks = "Jalan "+menitJalan(r)+" mnt";
          isi.push({ri:ri, st:st, e:e, teks:teks});
        });
      });
      return {a:a, ai:ai, isi:isi, sudah:sudah};
    });

    aturTinggiBaris(kolom);

    document.getElementById("papan").innerHTML = kolom.map(function(k){
      var jadwal = k.a.rit.map(function(r, ri){
        return "Rit "+(ri+1)+" "+(r.berangkat ? jam(r.berangkat) : "belum berangkat");
      }).join(" · ");

      var daftar = k.isi.length
        ? k.isi.map(function(b){
            var kunci = k.ai+"-"+b.ri+"-"+b.st.n;
            var berubah = prevStatus[kunci] !== undefined && prevStatus[kunci] !== b.teks;
            prevStatus[kunci] = b.teks;
            var kelasIsi = (berubah && b.e === "sampai") ? " isi" : "";
            return '<div class="krow'+kelasIsi+'" data-s="'+b.e+'" style="--slot:'+WARNA[b.e]+'">'+
              (b.e === "sampai" ? '<i class="riak"></i>' : '')+
              '<span class="kc-rit">R'+(b.ri+1)+'</span>'+

    } else {
      ticker.classList.add("pesan");

      potongan = PESAN.map(function(t, i){
        return '<b class="tk" style="color:'+WARNA_PESAN[i % WARNA_PESAN.length]+'">'+esc(t)+'</b>';
      });

      el.innerHTML = isiTicker;

      el.style.animationDuration = Math.max(24, Math.round(panjang / 4.5)) + "s";
    }
  }

  /* ---------- HP pengantar ---------- */
  var akuIdx = 1;
  function aku(){ return armada[Math.min(akuIdx, armada.length-1)] || armada[0]; }

  function renderHp(){
    var AKU = aku();
    var totalSekolah = AKU.rit.reduce(function(x,r){ return x + r.stops.length; }, 0);
    document.getElementById("hpName").textContent = AKU.pengantar || "(belum diisi)";
    document.getElementById("hpSub").textContent =
      AKU.kode+" · "+AKU.nopol+" · "+totalSekolah+" sekolah · "+AKU.rit.length+" rit";

    document.getElementById("hpPick").innerHTML = (armada.length < 2 || terkunci) ? "" :
      '<span class="hp-pick-l">Armada</span><select class="hp-pick" data-f="pilihKurir" aria-label="Pilih armada">'+
      armada.map(function(a, i){
        return '<option value="'+i+'"'+(i === akuIdx ? ' selected' : '')+'>'+
          esc(a.kode)+(a.pengantar ? ' · '+esc(a.pengantar) : '')+'</option>';
      }).join("")+'</select>';

    var html = "";
    AKU.rit.forEach(function(r, ri){
      var aktif = [], selesai = [];
      r.stops.forEach(function(st, i){ (st.s === "sampai" ? selesai : aktif).push({st:st, i:i}); });

      html += '<div class="hp-rit">'+
        '<div class="hp-rit-t">Rit '+(ri+1)+' · '+r.stops.length+' sekolah</div>';

      if(r.berangkat){
        html += '<div class="hp-brk"><span>Berangkat '+jam(r.berangkat)+
          (aktif.length ? ' · antaran terakhir '+menitJalan(r)+' menit lalu' : ' · rit selesai')+'</span>'+
          '<button class="hp-undo" data-act="batal-berangkat" data-r="'+ri+'">Batalkan</button></div>';
      } else {
        html += '<button class="depart" data-act="depart" data-r="'+ri+'">Berangkat rit '+(ri+1)+'</button>';
        if(ri > 0 && !ritSelesai(AKU.rit[ri-1])){
          html += '<div class="hp-warn">Rit '+ri+' belum selesai semua — tekan hanya kalau memang sudah muat ulang.</div>';
        }
      }

      if(aktif.length){
        html += '<div class="hp-section">Belum diantar · '+aktif.length+' sekolah</div>'+
          aktif.map(function(o){
            var e = efektif(r, o.st);
            return '<div class="stop" style="--slot:'+WARNA[e]+'">'+
              '<div class="stop-name">'+esc(o.st.n)+'</div>'+
              '<div class="stop-meta">'+esc(o.st.j)+' · '+angka(o.st.pm)+' PM · urutan ke-'+(o.i+1)+'</div>'+
              (o.st.s === "kendala" && o.st.ket ? '<div class="stop-note">'+esc(o.st.ket)+'</div>' : '')+
              '<div class="stop-actions">'+
                '<button class="btn-arrive" data-arrive="'+o.i+'" data-r="'+ri+'">Sudah sampai</button>'+
                '<button class="btn-issue" data-issue="'+o.i+'" data-r="'+ri+'">Kendala</button>'+
              '</div></div>';
          }).join("");
      } else if(r.stops.length){
        html += '<div class="hp-empty">Semua sekolah di rit ini sudah selesai.</div>';
      }

      if(selesai.length){
        html += '<div class="hp-section">Sudah diantar · '+selesai.length+' sekolah</div>'+
          selesai.map(function(o){
            return '<div class="stop" style="--slot:var(--sampai)">'+
              '<div class="stop-name">'+esc(o.st.n)+'</div>'+
              '<div class="stop-meta">'+esc(o.st.j)+' · '+angka(o.st.pm)+' PM</div>'+
              '<div class="stop-done"><span>Sampai '+jam(o.st.t)+'</span>'+
                '<button class="hp-undo" data-act="batal-sampai" data-r="'+ri+'" data-i="'+o.i+'">Batalkan</button>'+
              '</div></div>';
          }).join("");
      }
      html += '</div>';
    });

    document.getElementById("hpActive").innerHTML = html;
    document.getElementById("hpDoneWrap").innerHTML = "";
  }


  document.body.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-arrive],[data-issue]");
    if(!b) return;
    var r = aku().rit[+b.getAttribute("data-r")];
    if(!r) return;
    if(!r.berangkat) r.berangkat = new Date();

    if(b.hasAttribute("data-arrive")){
      var st = r.stops[+b.getAttribute("data-arrive")];
      st.s = "sampai"; st.t = new Date(); st.ket = null;
      antre({action:"status", id:st.id, status:"sampai", jam:jamKini(), catatan:""});
    } else {
      var s2 = r.stops[+b.getAttribute("data-issue")];
      var ket = window.prompt("Apa kendalanya?", s2.ket || "");
      if(ket === null) return;
      s2.s = "kendala"; s2.ket = ket.trim() || "Belum ada keterangan"; s2.t = null;
      antre({action:"status", id:s2.id, status:"kendala", jam:"", catatan:s2.ket});

    renderBoard(); renderHp();

  /* ---------- Simulasi ---------- */
  var simTimer = null;
  document.getElementById("simBtn").addEventListener("click", function(){
    var b = this;
    if(simTimer){
      clearInterval(simTimer); simTimer = null;
      b.classList.remove("is-on"); b.textContent = "Simulasi";
      return;
    }
    b.classList.add("is-on"); b.textContent = "Berhenti";
    simTimer = setInterval(function(){
      var kandidat = [];
      armada.forEach(function(a){
        a.rit.forEach(function(r, ri){
          if(!r.berangkat){
            var siap = ri === 0 || ritSelesai(a.rit[ri-1]);
            if(siap && Math.random() < .35){
              r.berangkat = new Date();
              r.stops.forEach(function(st){ if(st.s === "belum") st.s = "jalan"; });
            }
            return;
          }
          r.stops.forEach(function(st){ if(st.s === "jalan") kandidat.push(st); });
        });
      });
      if(kandidat.length){
        var pilih = kandidat[Math.floor(Math.random()*kandidat.length)];
        pilih.s = "sampai"; pilih.t = new Date();
      }
      render();
    }, 2500);
  });



  /* ================= SAMBUNGAN CLOUD ================= */
  /* Tempel URL Web App Apps Script di bawah ini. Dibiarkan kosong = mode contoh. */
  var API = "https://script.google.com/macros/s/AKfycbwGDruZYiZsmcwUvxpa-eZVP6lT4_3t3tiMlnimWAr-lF_FQD2nlnF0168lbs_bgXDJNQ/exec";

  var ANTREAN_KUNCI = "mbgAntrean", KURIR_KUNCI = "mbgKurir";
  var antrean = [], sedangKirim = false, statusSync = "contoh";

  function simpanLokal(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function bacaLokal(k, bawaan){
    try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : bawaan; }catch(e){ return bawaan; }
  }

  function tglHariIni(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function jamKini(){
    var d = new Date();
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  function jamKeTanggal(j){
    if(!j) return null;
    var b = String(j).split(":");
    if(b.length < 2) return null;
    var d = new Date();
    d.setHours(+b[0], +b[1], 0, 0);
    return d;
  }

  function apiKirim(isi){
    return fetch(API, {
      method:"POST", redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(isi)
    }).then(function(r){ return r.json(); });
  }

  /* ---------- antrean tahan sinyal jelek ---------- */
  function antre(isi){
    if(!API) return;
    isi.tanggal = tglHariIni();
    isi.ts = new Date().toISOString();
    isi.oleh = (aku() && aku().kode) || "papan";
    antrean.push(isi);
    simpanLokal(ANTREAN_KUNCI, antrean);
    kirimAntrean();
  }

  function kirimAntrean(){
    if(!API || sedangKirim || !antrean.length) return;
    sedangKirim = true;
    apiKirim(antrean[0]).then(function(r){
      sedangKirim = false;
      if(r && r.ok){
        antrean.shift();
        simpanLokal(ANTREAN_KUNCI, antrean);
        statusSync = "tersambung";
        if(antrean.length) setTimeout(kirimAntrean, 300);
      } else {
        statusSync = "gagal";
      }
      tandaSync();
    }).catch(function(){
      sedangKirim = false; statusSync = "offline"; tandaSync();
    });
  }

  /* ---------- susun ulang model dari data server ---------- */
  function terapkanServer(d){
    var idx = {}, baru = [];
    d.armada.forEach(function(a, i){
      idx[a.kode] = i;
      baru.push({kode:a.kode, pengantar:a.pengantar, nopol:a.nopol, rit:[]});
    });

    d.sekolah.forEach(function(sk){
      var ai = idx[sk.armada];
      if(ai === undefined) return;
      var ri = Math.max(0, (+sk.rit || 1) - 1), a = baru[ai];
      while(a.rit.length <= ri) a.rit.push({berangkat:null, stops:[]});
      a.rit[ri].stops.push({id:sk.id, n:sk.nama, j:sk.jenjang, pm:+sk.pm || 0,
                            s:"belum", t:null, ket:null});
    });
    baru.forEach(function(a){ if(!a.rit.length) a.rit.push({berangkat:null, stops:[]}); });

    (d.rit || []).forEach(function(x){
      var ai = idx[x.armada];
      if(ai === undefined) return;
      var r = baru[ai].rit[(+x.rit || 1) - 1];
      if(!r) return;
      r.berangkat = jamKeTanggal(x.jam_berangkat);
      if(r.berangkat) r.stops.forEach(function(st){ if(st.s === "belum") st.s = "jalan"; });
    });

    var peta = {};
    (d.harian || []).forEach(function(h){ peta[h.id] = h; });
    baru.forEach(function(a){ a.rit.forEach(function(r){ r.stops.forEach(function(st){
      var h = peta[st.id];
      if(!h || !h.status) return;
      st.s = h.status;
      st.t = h.status === "sampai" ? jamKeTanggal(h.jam_sampai) : null;
      st.ket = h.catatan || null;
    }); }); });

    if(baru.length){
      armada = baru;
      if(akuIdx >= armada.length) akuIdx = 0;
    }
  }

  function muatServer(){
    if(!API) return Promise.resolve();
    return fetch(API + "?action=data&tanggal=" + tglHariIni())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d || !d.ok) throw new Error(d && d.pesan);
        terapkanServer(d);
        statusSync = "tersambung";
        render(); tandaSync();
      })
      .catch(function(){ statusSync = "offline"; tandaSync(); });
  }

  function tandaSync(){
    var el = document.getElementById("syncInfo");
    var el2 = document.getElementById("hpSync");
    if(el2){
      el2.textContent = "v6 · " + (
        !API ? "URL server belum terisi"
        : antrean.length ? antrean.length + " perubahan menunggu terkirim"
        : statusSync === "tersambung" ? "Tersimpan · tersambung"
        : "Terputus, akan dikirim ulang");
    }
    if(!el) return;
    if(!API){ el.textContent = "Mode contoh · data tidak tersimpan"; return; }
    var sisa = antrean.length ? " · " + antrean.length + " menunggu kirim" : "";
    var teks = {tersambung:"Tersambung", offline:"Terputus, akan dikirim ulang",
                gagal:"Server menolak data", contoh:"Menghubungkan"}[statusSync] || statusSync;
    el.textContent = teks + sisa;
  }

  /* ---------- pilihan armada untuk mode pengantar ---------- */
  function pakaiKurir(){
    var q = new URLSearchParams(location.search);
    var minta = (q.get("armada") || "").toUpperCase();
    var pilih = -1;

    if(minta) armada.forEach(function(a, i){ if(a.kode.toUpperCase() === minta) pilih = i; });
    if(pilih < 0){
      var simpan = bacaLokal(KURIR_KUNCI, null);
      if(simpan) armada.forEach(function(a, i){ if(a.kode === simpan) pilih = i; });
    }
    akuIdx = pilih >= 0 ? pilih : 0;
    renderHp();
  }

            html += '<div class="k-row">'+

              '<input class="k-in k-jen" value="'+esc(st.j)+'" data-a="'+ai+'" data-r="'+ri+'" data-i="'+i+'" data-f="j" placeholder="SD" aria-label="Jenjang">'+

  /* isian teks: model diperbarui tanpa menggambar ulang panel (biar kursor tidak lompat) */
  document.body.addEventListener("input", function(ev){
    var el = ev.target;
    if(!el.dataset || el.dataset.f === undefined || el.tagName === "SELECT") return;
    var f = el.dataset.f, a = armada[+el.dataset.a];
    if(!a) return;
    if(el.dataset.i === undefined){
      a[f] = (f === "kode") ? el.value.toUpperCase() : el.value;
    } else {
      var r = a.rit[+el.dataset.r];
      if(!r) return;
      var st = r.stops[+el.dataset.i];
      if(!st) return;
      if(f === "pm") st.pm = Math.max(0, parseInt(el.value, 10) || 0);
      else st[f] = el.value;
    }
    renderBoard(); renderHp();
  });

  document.body.addEventListener("change", function(ev){
    var el = ev.target;
    if(el.tagName !== "SELECT" || !el.dataset.f) return;
    if(el.dataset.f === "aku"){ akuIdx = +el.value; renderHp(); return; }
    if(el.dataset.f === "pilihKurir"){
      akuIdx = +el.value;
      simpanLokal(KURIR_KUNCI, armada[akuIdx] && armada[akuIdx].kode);
      renderHp();
      return;
    }
    if(el.dataset.f === "pindah"){
      var dari = armada[+el.dataset.a] && armada[+el.dataset.a].rit[+el.dataset.r];
      var tuju = el.value.split(":");
      var ke = armada[+tuju[0]] && armada[+tuju[0]].rit[+tuju[1]];
      if(!dari || !ke || dari === ke) return;
      ke.stops.push(dari.stops.splice(+el.dataset.i, 1)[0]);
      renderSemua();
    }
  });

  document.body.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-act]");
    if(!b) return;
    var act = b.dataset.act, ai = +b.dataset.a, ri = +b.dataset.r, i = +b.dataset.i;
    var a = armada[ai], r = a && a.rit[ri];

    if(act === "depart"){
      var rr = aku().rit[ri];
      if(!rr || rr.berangkat) return;
      rr.berangkat = new Date();
      rr.stops.forEach(function(st){ if(st.s === "belum") st.s = "jalan"; });
      antre({action:"berangkat", armada:aku().kode, rit:ri+1, jam:jamKini()});
      renderBoard(); renderHp();
      return;
    }
    if(act === "tema"){
      setTema(!document.body.classList.contains("gelap"));
      return;
    }
    else if(act === "batal-sampai"){
      var rs = aku().rit[ri];
      var stB = rs && rs.stops[i];
      if(!stB) return;
      if(!window.confirm('Batalkan status sampai untuk "'+stB.n+'"?')) return;
      stB.s = rs.berangkat ? "jalan" : "belum";
      stB.t = null; stB.ket = null;
      antre({action:"status", id:stB.id, status:stB.s, jam:"", catatan:""});
      renderBoard(); renderHp();
      return;
    }
    else if(act === "batal-berangkat"){
      var rb = aku().rit[ri];
      if(!rb || !rb.berangkat) return;
      if(!window.confirm("Batalkan jam berangkat rit "+(ri+1)+"? Sekolah yang sudah tercatat sampai tidak berubah.")) return;
      rb.berangkat = null;
      rb.stops.forEach(function(st){ if(st.s === "jalan") st.s = "belum"; });
      antre({action:"berangkat", armada:aku().kode, rit:ri+1, jam:""});
      renderBoard(); renderHp();
      return;
    }
    else if(act === "add-armada"){
      armada.push({kode:"A"+(armada.length+1), pengantar:"", nopol:"",
                   rit:[{berangkat:null, stops:[]}, {berangkat:null, stops:[]}]});
    }
    else if(act === "del-armada"){
      if(!a) return;
      var sisa = [];
      a.rit.forEach(function(x){ sisa = sisa.concat(x.stops); });
      var pesan = sisa.length
        ? "Hapus "+a.kode+"? "+sisa.length+" sekolah akan dipindah ke rit 1 armada pertama."
        : "Hapus "+a.kode+"?";
      if(!window.confirm(pesan)) return;
      armada.splice(ai, 1);
      if(sisa.length) armada[0].rit[0].stops = armada[0].rit[0].stops.concat(sisa);
      if(akuIdx >= armada.length) akuIdx = armada.length - 1;
    }
    else if(act === "add-rit"){
      if(!a) return;
      a.rit.push({berangkat:null, stops:[]});
    }
    else if(act === "del-rit"){
      if(!a || !r || a.rit.length < 2) return;
      if(r.stops.length && !window.confirm("Hapus rit "+(ri+1)+"? "+r.stops.length+" sekolah akan dipindah ke rit 1.")) return;
      a.rit.splice(ri, 1);
      if(r.stops.length) a.rit[0].stops = a.rit[0].stops.concat(r.stops);
    }
    else if(act === "add-stop"){
      if(!r) return;
      r.stops.push({n:"Sekolah baru", j:"SD", pm:0, s:r.berangkat ? "jalan" : "belum", t:null});
    }
    else if(act === "del-stop"){
      if(!r || !r.stops[i]) return;
      if(!window.confirm('Hapus "'+r.stops[i].n+'" dari '+a.kode+"/"+(ri+1)+"?")) return;
      r.stops.splice(i, 1);
    }
    else if(act === "up"){
      if(!r || i < 1) return;
      r.stops.splice(i-1, 0, r.stops.splice(i, 1)[0]);
    }
    else if(act === "down"){
      if(!r || i >= r.stops.length - 1) return;
      r.stops.splice(i+1, 0, r.stops.splice(i, 1)[0]);
    }
    else if(act === "simpan"){
      if(!API) return;
      var mArmada = [], mSekolah = [];
      armada.forEach(function(x){
        mArmada.push({kode:x.kode, pengantar:x.pengantar, nopol:x.nopol});
        x.rit.forEach(function(y, yi){
          y.stops.forEach(function(st, si){
            if(!st.id) st.id = "S" + Date.now() + Math.floor(Math.random()*1000);
            mSekolah.push({id:st.id, armada:x.kode, rit:yi+1, urutan:si+1,
                           nama:st.n, jenjang:st.j, pm:st.pm});
          });
        });
      });
      b.textContent = "Menyimpan…";
      apiKirim({action:"master", armada:mArmada, sekolah:mSekolah}).then(function(res){
        b.textContent = (res && res.ok) ? "Tersimpan" : "Gagal menyimpan";
        setTimeout(function(){ b.textContent = "Simpan ke cloud"; }, 2500);
      }).catch(function(){
        b.textContent = "Gagal, cek sambungan";
        setTimeout(function(){ b.textContent = "Simpan ke cloud"; }, 2500);
      });
      return;
    }
    else if(act === "reset"){
      if(!window.confirm("Kembalikan semua status ke Menunggu? Jam berangkat dan jam tiba akan dikosongkan.")) return;
      armada.forEach(function(x){
        x.rit.forEach(function(y){
          y.berangkat = null;
          y.stops.forEach(function(st){ st.s = "belum"; st.t = null; st.ket = null; });
        });
      });
      prevStatus = {};
      if(API){
        armada.forEach(function(x){
          x.rit.forEach(function(y, yi){
            antre({action:"berangkat", armada:x.kode, rit:yi+1, jam:""});
            y.stops.forEach(function(st){
              antre({action:"status", id:st.id, status:"belum", jam:"", catatan:""});
            });
          });
        });
      }
    }
    else return;

    renderSemua();
  });

  function renderSemua(){ renderBoard(); renderHp(); renderKelola(); }


  /* ---------- Terang / gelap ---------- */
  function setTema(gelap){
    document.body.classList.toggle("gelap", gelap);
    if(document.getElementById("viewKl").classList.contains("is-active")) renderKelola();
  }

  /* ---------- Sembunyikan / tampilkan menu ---------- */
  var terkunci = false;
  function menuSepi(sepi){
    document.body.classList.toggle("ui-sepi", sepi);
    if(sepi) document.getElementById("hotspot").blur();
  }
  document.getElementById("hotspot").addEventListener("click", function(){ pilihTampilan("kelola"); });
  document.addEventListener("keydown", function(ev){
    if(terkunci) return;
    if(ev.key !== "h" && ev.key !== "H") return;
    if(/^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName)) return;
    pilihTampilan(document.getElementById("viewKl").classList.contains("is-active") ? "tv" : "kelola");
  });

  /* ---------- Jam & tampilan ---------- */
  /* ---------- pemasangan aplikasi (PWA) ---------- */
  if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }

  var promptPasang = null;
  window.addEventListener("beforeinstallprompt", function(ev){
    ev.preventDefault();
    promptPasang = ev;
    var b = document.getElementById("pasangBtn");
    if(b) b.style.display = "block";
  });

  document.getElementById("pasangBtn").addEventListener("click", function(){
    var b = this;
    if(!promptPasang) return;
    promptPasang.prompt();
    promptPasang.userChoice.then(function(){
      promptPasang = null;
      b.style.display = "none";
    });
  });

  window.addEventListener("appinstalled", function(){
    var b = document.getElementById("pasangBtn");
    if(b) b.style.display = "none";
  });

  /* iPhone tidak punya tombol pasang otomatis, jadi diberi petunjuk manual */
  (function(){
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
    var sudahTerpasang = window.navigator.standalone === true ||
                         window.matchMedia("(display-mode: standalone)").matches;
    if(ios && !sudahTerpasang){
      var el = document.getElementById("hpIos");
      el.textContent = "Untuk memasang di iPhone: tekan tombol Bagikan di bawah layar, lalu pilih Tambahkan ke Layar Utama.";
      el.classList.add("is-on");
    }
  })();

  /* ---------- pergantian hari ---------- */
  var tanggalAktif = tglHariIni();

  function cekGantiHari(){
    var t = tglHariIni();
    if(t === tanggalAktif) return;

    tanggalAktif = t;
    prevStatus = {};        // supaya tidak semua baris ikut berputar sekaligus

    if(API){
      muatServer();         // hari baru di server masih kosong, semua kembali Menunggu
    } else {
      armada.forEach(function(a){
        a.rit.forEach(function(r){
          r.berangkat = null;
          r.stops.forEach(function(st){ st.s = "belum"; st.t = null; st.ket = null; });
        });
      });
      render();
    }
  }

  var HARI = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
  var BULAN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  function tickClock(){
    cekGantiHari();
    var d = new Date();
    document.getElementById("clockTime").textContent =
      String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
    document.getElementById("clockDate").textContent =
      HARI[d.getDay()]+" "+d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear();
  }

  var WADAH = {tv:"viewTv", kurir:"viewHp", kelola:"viewKl"};
  function pilihTampilan(mode){
    if(terkunci) mode = "kurir";
    if(!WADAH[mode]) mode = "tv";
    Object.keys(WADAH).forEach(function(k){
      document.getElementById(WADAH[k]).classList.toggle("is-active", k === mode);
    });
    document.querySelector(".bfoot").style.display = (mode === "tv") ? "flex" : "none";
    if(mode === "kelola") renderKelola();
    window.scrollTo(0,0);
  }

  document.body.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-nav]");
    if(b) pilihTampilan(b.dataset.nav);
  });

  function render(){ renderBoard(); renderHp(); }

  if(API) document.getElementById("simBtn").style.display = "none";
  antrean = bacaLokal(ANTREAN_KUNCI, []);
  render();
  tandaSync();
  if(API){
    muatServer().then(pakaiKurir);
    setInterval(function(){ if(!antrean.length) muatServer(); }, 20000);
    setInterval(kirimAntrean, 8000);
    window.addEventListener("online", kirimAntrean);
  }
  tickClock();
  setInterval(tickClock, 1000);
  setInterval(render, 30000);
  window.addEventListener("resize", renderBoard);

  var q = new URLSearchParams(location.search);
  terkunci = q.get("kunci") === "1";
  if(terkunci) document.body.classList.add("terkunci");

  var mode = q.get("mode");
  if(terkunci) pilihTampilan("kurir");
  else if(mode) pilihTampilan(mode);
  if(terkunci || q.get("menu") === "0") menuSepi(true);
  if(q.get("tema") === "gelap") setTema(true);
})();
</script>
</body>
</html>
